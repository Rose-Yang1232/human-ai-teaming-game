<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replay tutorial</title>
    <style>
        body {
            margin: 0;
            padding: 24px;
            font-family: system-ui, -apple-system, sans-serif;
            background: #1a1a1a;
            color: #f5f5f5;
        }
        .wrap {
            max-width: 960px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0 0 16px;
        }
        video {
            width: 100%;
            display: block;
            border-radius: 8px;
            background: #000;
        }
        .actions {
            margin-top: 16px;
        }
        button {
            padding: 8px 16px;
            cursor: pointer;
            border: 1px solid #555;
            border-radius: 6px;
            background: #333;
            color: #f5f5f5;
        }
        button:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Tutorial walkthrough (video)</h1>
        <video controls playsinline preload="metadata">
            <source src="../images/yuwei_tutorial.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="actions">
            <button type="button" onclick="window.close()">Close</button>
        </div>
    </div>
</body>
</html>
