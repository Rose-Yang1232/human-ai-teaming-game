<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Round 2 Transition</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/onboarding-flow.css">
    <style>
        .site-header {
            background-color: #0064a4;
            color: #fff;
            padding: 8px 0;
        }
        .site-header .title {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
        }
        .brand-logo {
            width: 70px;
            height: 30px;
            object-fit: contain;
        }
        .transition-page {
            color: #111827;
        }
        .transition-page .flow-card {
            max-width: 980px;
        }
        .sub-header {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 14px;
        }
        .transition-text {
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 14px;
        }
    </style>
</head>
<body class="transition-page">
    <header class="site-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-2"><img class="brand-logo" src="../images/purdue_logo.png" alt="Purdue logo"></div>
                <div class="col-8"><h2 class="title">Target Intercept Game</h2></div>
                <div class="col-2 text-right"><img class="brand-logo" src="../images/purdue_logo.png" alt="Purdue logo"></div>
            </div>
        </div>
    </header>

    <main class="container mt-3">
        <div class="flow-card">
            <div class="sub-header">Target Interception Game: Round 2</div>
            <p class="transition-text">
                You've completed your first target interception game, and you have one more such game to complete in this study.
            </p>
            <p class="transition-text">
                Whenever you are ready, click the button below to proceed to the second game.
            </p>
            <div class="flow-btn-row">
                <a class="btn btn-primary btn-lg" href="game-main-exp.html?debug=true&collab=1&session=2">Next</a>
            </div>
        </div>
    </main>
    <script src="../js/api-client.js"></script>
</body>
</html>
